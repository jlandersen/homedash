# HomeDash - Example Application Manifest
# ========================================
#
# This file defines all applications displayed on your dashboard.
# Edit this file and save - the dashboard will automatically refresh!
#
# Each app entry supports the following fields:
#
#   name:        (required) Display name for the app
#   url:         (required) Full URL to the app (used for health checks and linking)
#   category:    (optional) Group name for organizing apps (default: "Uncategorized")
#   icon:        (optional) Icon name from the list below (default: "box")
#   check_path:  (optional) Custom path for HTTP health checks (default: "/")
#   check_type:  (optional) "http" or "tcp" - type of health check (default: "http")
#   skip_check:  (optional) true/false - skip health checks entirely (default: false)
#                           Useful for devices that may wake up (e.g. NAS) or services
#                           you don't want to monitor
#
# Agent Configuration:
# -------------------
# You can configure remote agents to monitor system stats (CPU, RAM, Temp) from
# multiple servers. Each agent should be running HomeDash in agent mode.
#
# To run HomeDash in agent mode on a remote server:
#   HOMEDASH_AGENT_MODE=true ./homedash
#
# Then add the agent to this config:
#
# agents:
#   - name: Server 1
#     url: http://192.168.1.10:8080
#   - name: Server 2
#     url: http://192.168.1.20:8080
#
# Available Icons:
# ----------------
#   film       - Movie/video icon (for Plex, Jellyfin, Radarr, etc.)
#   tv         - Television icon (for live TV, streaming)
#   music      - Music note icon (for Spotify, Navidrome, etc.)
#   download   - Download arrow icon (for Sonarr, SABnzbd, etc.)
#   home       - House icon (for Home Assistant, smart home)
#   workflow   - Flow/nodes icon (for Node-RED, n8n, automation)
#   shield     - Shield icon (for Pi-hole, AdGuard, security)
#   network    - Network topology icon (for routers, network tools)
#   server     - Server rack icon (for Portainer, Proxmox, etc.)
#   database   - Database cylinder icon (for databases, storage)
#   chart      - Line chart icon (for Grafana, monitoring)
#   code       - Code brackets icon (for VS Code, development)
#   git        - Git icon (for Gitea, GitLab, repositories)
#   terminal   - Terminal icon (for SSH, shell access)
#   box        - Default box icon (fallback)
#
# Health Check Types:
# -------------------
#   http  - (default) Sends HTTP GET request, expects 2xx/3xx response
#   tcp   - Opens TCP connection to host:port, useful for non-HTTP services
#

