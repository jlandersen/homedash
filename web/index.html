<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeDash</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Header with clock and stats -->
        <header class="header">
            <div class="time-section">
                <h1 class="clock" id="clock">00:00</h1>
                <p class="date" id="date">Loading...</p>
            </div>
            <div class="stats-section" id="stats">
                <div class="stat-card" id="stat-cpu">
                    <div class="stat-icon cpu-icon">
                        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                            <use href="icons/cpu.svg"></use>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">CPU</span>
                        <span class="stat-value"><span id="cpu-value">--</span><span class="stat-unit">%</span></span>
                    </div>
                </div>
                <div class="stat-card" id="stat-ram">
                    <div class="stat-icon ram-icon">
                        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                            <use href="icons/ram.svg"></use>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">RAM</span>
                        <span class="stat-value"><span id="ram-value">--</span><span class="stat-unit">%</span></span>
                    </div>
                </div>
                <div class="stat-card" id="stat-temp">
                    <div class="stat-icon temp-icon">
                        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                            <use href="icons/temp.svg"></use>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Temp</span>
                        <span class="stat-value"><span id="temp-value">--</span><span class="stat-unit">°C</span></span>
                    </div>
                </div>
                <div class="stats-details" id="statsDetails" style="display: none;">
                    <div class="details-panel" id="detailsPanel">
                        <div class="details-section" id="detailsHostTrends">
                            <div class="details-title">Host Trends (5m)</div>
                            <div class="details-trends">
                                <div class="sparkline-card">
                                    <div class="sparkline-label">CPU</div>
                                    <div class="sparkline-value" id="host-cpu-value">--</div>
                                    <div class="sparkline" id="host-cpu-spark"></div>
                                </div>
                                <div class="sparkline-card">
                                    <div class="sparkline-label">RAM</div>
                                    <div class="sparkline-value" id="host-ram-value">--</div>
                                    <div class="sparkline" id="host-ram-spark"></div>
                                </div>
                                <div class="sparkline-card">
                                    <div class="sparkline-label">Temp</div>
                                    <div class="sparkline-value" id="host-temp-value">--</div>
                                    <div class="sparkline" id="host-temp-spark"></div>
                                </div>
                                <div class="sparkline-card" id="host-tx-card">
                                    <div class="sparkline-label">TX</div>
                                    <div class="sparkline-value" id="host-tx-value">--</div>
                                    <div class="sparkline" id="host-tx-spark"></div>
                                </div>
                                <div class="sparkline-card" id="host-rx-card">
                                    <div class="sparkline-label">RX</div>
                                    <div class="sparkline-value" id="host-rx-value">--</div>
                                    <div class="sparkline" id="host-rx-spark"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Search/Action bar -->
        <div class="action-bar">
            <button class="search-trigger" id="searchBtn">
                <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                    <use href="icons/search.svg"></use>
                </svg>
                <span>Quick launch...</span>
                <kbd>⌘K</kbd>
            </button>
            <button class="theme-toggle" id="themeBtn" title="Toggle theme">
                <svg class="sun-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                    <use href="icons/sun.svg"></use>
                </svg>
                <svg class="moon-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                    <use href="icons/moon.svg"></use>
                </svg>
            </button>
            <button class="view-toggle" id="viewBtn" title="Toggle view">
                <svg class="cards-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                    <use href="icons/cards.svg"></use>
                </svg>
                <svg class="rows-icon ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                    <use href="icons/rows.svg"></use>
                </svg>
            </button>
            <button class="edit-toggle" id="editBtn" title="Edit apps">
                <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                    <use href="icons/edit.svg"></use>
                </svg>
            </button>
        </div>

        <!-- App grid by category -->
        <main class="content" id="appGrid">
            <div class="loading">Loading apps...</div>
        </main>
    </div>

    <!-- Command palette modal -->
    <div class="modal-overlay" id="commandPalette">
        <div class="modal">
            <div class="modal-header">
                <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                    <use href="icons/search.svg"></use>
                </svg>
                <input type="text" id="searchInput" placeholder="Search apps..." autocomplete="off">
                <kbd>ESC</kbd>
            </div>
            <div class="search-results" id="searchResults">
                <div class="search-hint">Type to search...</div>
            </div>
        </div>
    </div>

    <!-- Edit mode modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal edit-modal">
            <div class="modal-header">
                <div class="modal-title">Edit Apps</div>
                <div class="modal-actions">
                    <button class="secondary-button" id="editCancelBtn">Cancel</button>
                    <button class="primary-button" id="editSaveBtn">Save</button>
                </div>
            </div>
            <div class="edit-body">
                <div class="edit-hint">Edit apps below. Delete removes the entry from apps.yaml.</div>
                <div class="edit-list" id="editList"></div>
                <button class="ghost-button" id="editAddBtn">Add app</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
