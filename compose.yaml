services:
  homedash:
    build: .
    container_name: homedash
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    ports:
      - "9443:8080"
    volumes:
      - ./appdata:/appdata
      - ./ssl:/ssl:ro
    environment:
      - HOMEDASH_MANIFEST=/appdata/apps.yaml
      - HOMEDASH_TLS_CERT=/ssl/cert.pem
      - HOMEDASH_TLS_KEY=/ssl/key.pem
