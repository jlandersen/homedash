services:
  homedash:
    build: .
    container_name: homedash
    restart: unless-stopped
    ports:
      - "9443:8080"
    volumes:
      - ./apps.yaml:/apps.yaml:ro
      - ./ssl:/ssl:ro
    environment:
      - HOMEDASH_MANIFEST=/apps.yaml
      - HOMEDASH_TLS_CERT=/ssl/cert.pem
      - HOMEDASH_TLS_KEY=/ssl/key.pem
