# Docker Compose Example: Multi-Server Setup with Agent Mode
# ==========================================================
#
# This example shows how to set up HomeDash across multiple servers:
# - One main dashboard server (shows UI + monitors apps + aggregates stats)
# - Multiple agent servers (expose only stats endpoints)
#
# Use Case:
# You have multiple physical/virtual servers and want to monitor system stats
# (CPU, RAM, Temperature) from all of them in a single dashboard.

# ==========================================
# MAIN DASHBOARD SERVER (Server 1)
# ==========================================
# This is your primary HomeDash instance with the full UI.
# It monitors apps and polls agent servers for their stats.
#
# Deploy this on your main server where you want to access the dashboard.

services:
  homedash-dashboard:
    image: ghcr.io/jlandersen/homedash:latest
    container_name: homedash-dashboard
    ports:
      - "8080:8080"
    volumes:
      - ./apps.yaml:/apps.yaml:ro
    environment:
      - HOMEDASH_MANIFEST=/apps.yaml
      - HOMEDASH_PORT=8080
      - HOMEDASH_CHECK_INTERVAL=30s
      # UI Settings
      - HOMEDASH_TIME_24H=false
      - HOMEDASH_SHOW_CPU=true
      - HOMEDASH_SHOW_RAM=true
      - HOMEDASH_SHOW_TEMP=true
    restart: unless-stopped
    networks:
      - homedash

# ==========================================
# EXAMPLE apps.yaml for main dashboard:
# ==========================================
# 
# apps:
#   - name: Plex
#     url: http://192.168.1.100:32400
#     category: Media
#     icon: film
#
#   - name: Home Assistant
#     url: http://192.168.1.50:8123
#     category: Smart Home
#     icon: home
#
# # Monitor stats from remote servers
# agents:
#   - name: Git Host
#     url: http://192.168.1.100:8081  # Agent running on Git host
#   - name: Docker Host
#     url: http://192.168.1.200:8081  # Agent running on docker host
#   - name: NAS
#     url: http://192.168.1.50:8081   # Agent running on NAS

# ==========================================
# AGENT SERVER (Server 2+)
# ==========================================
# Deploy this on additional servers that you want to monitor.
# This runs in agent mode - no UI, no health checks, just exposes /api/stats.
#
# Copy this block to a separate docker-compose.yml on each remote server,
# or use docker run command directly.

  homedash-agent:
    image: ghcr.io/jlandersen/homedash:latest
    container_name: homedash-agent
    ports:
      - "8081:8081"  # Different port to avoid conflicts
    environment:
      - HOMEDASH_AGENT_MODE=true  # This enables agent mode!
      - HOMEDASH_PORT=8081
    restart: unless-stopped
    # Note: No apps.yaml needed in agent mode
    # Note: No volumes needed unless you want to persist config
    networks:
      - homedash

networks:
  homedash:
    driver: bridge

# ==========================================
# DEPLOYMENT INSTRUCTIONS
# ==========================================
#
# 1. Main Dashboard Server (e.g., 192.168.1.10):
#    - Create apps.yaml with your apps and agents list
#    - Extract only the homedash-dashboard service to docker-compose.yml
#    - Run: docker compose up -d
#    - Access dashboard at http://192.168.1.10:8080
#
# 2. Each Remote Server (e.g., 192.168.1.100, 192.168.1.200):
#    - Extract only the homedash-agent service to docker-compose.yml
#    - Run: docker compose up -d
#    - Agent will expose stats at http://server-ip:8081/api/stats
#
# 3. Verify agents:
#    - curl http://192.168.1.100:8081/api/stats
#    - Should return: {"cpu":"45","ram":"67","temp":"52"}
#
# 4. Main dashboard will automatically poll all configured agents
#    and display their stats in the "Monitored Agents" section.
#
# ==========================================
# ALTERNATIVE: Docker Run Commands
# ==========================================
#
# Main Dashboard:
# docker run -d --name homedash-dashboard \
#   -p 8080:8080 \
#   -v $(pwd)/apps.yaml:/apps.yaml:ro \
#   -e HOMEDASH_MANIFEST=/apps.yaml \
#   ghcr.io/jlandersen/homedash:latest
#
# Agent (on each remote server):
# docker run -d --name homedash-agent \
#   -p 8081:8081 \
#   -e HOMEDASH_AGENT_MODE=true \
#   -e HOMEDASH_PORT=8081 \
#   ghcr.io/jlandersen/homedash:latest
#
# ==========================================
# TIPS
# ==========================================
#
# - Use consistent ports across agents for easier management (e.g., always 8081)
# - Agents use minimal resources (~5-10MB RAM)
# - Set up firewall rules to restrict /api/stats access if needed
# - Consider using Docker networks or VPNs for secure communication
# - Agents can run on the same hosts as your apps
